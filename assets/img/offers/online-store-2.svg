<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg-os2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3f57"/>
      <stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#bg-os2)"/>
  <!-- Browser frame -->
  <rect x="10" y="10" width="380" height="40" rx="6" fill="#1f3f57" stroke="#4d8dff" stroke-opacity="0.3"/>
  <circle cx="28" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="30" r="5" fill="#27c93f"/>
  <rect x="90" y="22" width="240" height="16" rx="3" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.2"/>
  <text x="105" y="33" font-family="monospace" font-size="9" fill="#4d8dff" opacity="0.7">shop.dhakakart.bd/cart</text>
  <!-- Page title -->
  <text x="20" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Shopping Cart</text>
  <text x="380" y="80" text-anchor="end" font-family="sans-serif" font-size="10" fill="#94a3b8">2 items</text>
  <!-- Cart items -->
  <g transform="translate(20,100)">
    <rect width="360" height="50" rx="6" fill="#1f3f57" stroke="#4d8dff" stroke-opacity="0.2"/>
    <rect x="10" y="10" width="30" height="30" rx="3" fill="#4d8dff" opacity="0.3"/>
    <text x="55" y="22" font-family="sans-serif" font-size="11" fill="#ffffff">Traditional saree</text>
    <text x="55" y="36" font-family="sans-serif" font-size="10" fill="#94a3b8">৳2,500 × 1</text>
    <text x="345" y="30" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4d8dff">৳2,500</text>
  </g>
  <g transform="translate(20,160)">
    <rect width="360" height="50" rx="6" fill="#1f3f57" stroke="#4d8dff" stroke-opacity="0.2"/>
    <rect x="10" y="10" width="30" height="30" rx="3" fill="#4c86b0" opacity="0.3"/>
    <text x="55" y="22" font-family="sans-serif" font-size="11" fill="#ffffff">Leather bag</text>
    <text x="55" y="36" font-family="sans-serif" font-size="10" fill="#94a3b8">৳1,800 × 1</text>
    <text x="345" y="30" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4d8dff">৳1,800</text>
  </g>
  <!-- Totals -->
  <rect x="20" y="225" width="360" height="60" rx="6" fill="#4d8dff" fill-opacity="0.06" stroke="#4d8dff" stroke-opacity="0.3"/>
  <text x="40" y="248" font-family="sans-serif" font-size="11" fill="#94a3b8">Subtotal</text>
  <text x="360" y="248" text-anchor="end" font-family="sans-serif" font-size="11" fill="#ffffff">৳4,300</text>
  <text x="40" y="272" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Total</text>
  <text x="360" y="272" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4d8dff">৳4,300</text>
</svg>
