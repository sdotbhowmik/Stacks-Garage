<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg-np" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3f57"/>
      <stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#bg-np)"/>
  <!-- Browser frame -->
  <rect x="10" y="10" width="380" height="40" rx="6" fill="#1f3f57" stroke="#4d8dff" stroke-opacity="0.3"/>
  <circle cx="28" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="30" r="5" fill="#27c93f"/>
  <rect x="90" y="22" width="240" height="16" rx="3" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.2"/>
  <text x="105" y="33" font-family="monospace" font-size="9" fill="#4d8dff" opacity="0.7">dailybangladesh.bd</text>
  <!-- Masthead -->
  <rect x="10" y="50" width="380" height="44" fill="#1f3f57"/>
  <text x="200" y="78" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#ffffff">DAILY BANGLADESH</text>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#94a3b8">Saturday, 18 January 2025 • 14:23 BST</text>
  <!-- Article cards -->
  <g transform="translate(15,104)">
    <rect width="180" height="100" rx="4" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.2"/>
    <rect x="8" y="8" width="164" height="50" rx="2" fill="#4d8dff" opacity="0.25"/>
    <text x="8" y="72" font-family="serif" font-size="9" font-weight="bold" fill="#ffffff">Education policy</text>
    <text x="8" y="84" font-family="sans-serif" font-size="6.5" fill="#94a3b8">8 hours ago • Politics</text>
  </g>
  <g transform="translate(205,104)">
    <rect width="180" height="100" rx="4" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.2"/>
    <rect x="8" y="8" width="164" height="50" rx="2" fill="#4c86b0" opacity="0.3"/>
    <text x="8" y="72" font-family="serif" font-size="9" font-weight="bold" fill="#ffffff">Cricket victory</text>
    <text x="8" y="84" font-family="sans-serif" font-size="6.5" fill="#94a3b8">3 hours ago • Sports</text>
  </g>
  <!-- List -->
  <g transform="translate(15,210)">
    <line x1="0" y1="0" x2="370" y2="0" stroke="#4d8dff" stroke-opacity="0.3"/>
    <g transform="translate(0,10)">
      <rect width="50" height="20" rx="2" fill="#4d8dff" opacity="0.4"/>
      <text x="60" y="14" font-family="serif" font-size="8" fill="#cbd5e1">Stock market ends week higher amid IT rally</text>
    </g>
    <g transform="translate(0,38)">
      <rect width="50" height="20" rx="2" fill="#4c86b0" opacity="0.4"/>
      <text x="60" y="14" font-family="serif" font-size="8" fill="#cbd5e1">Dhaka metro expands to Mirpur by Q3</text>
    </g>
    <g transform="translate(0,66)">
      <rect width="50" height="20" rx="2" fill="#4d8dff" opacity="0.4"/>
      <text x="60" y="14" font-family="serif" font-size="8" fill="#cbd5e1">Cyclone warning issued for coastal districts</text>
