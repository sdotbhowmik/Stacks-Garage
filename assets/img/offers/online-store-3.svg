<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg-os3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3f57"/>
      <stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#bg-os3)"/>
  <!-- Browser frame -->
  <rect x="10" y="10" width="380" height="40" rx="6" fill="#1f3f57" stroke="#4d8dff" stroke-opacity="0.3"/>
  <circle cx="28" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="30" r="5" fill="#27c93f"/>
  <rect x="90" y="22" width="240" height="16" rx="3" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.2"/>
  <text x="105" y="33" font-family="monospace" font-size="9" fill="#4d8dff" opacity="0.7">shop.dhakakart.bd/checkout</text>
  <!-- Title -->
  <text x="20" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Secure Checkout</text>
  <!-- Payment methods -->
  <g transform="translate(20,98)">
    <text x="0" y="12" font-family="sans-serif" font-size="10" fill="#cbd5e1" font-weight="bold">Choose payment</text>
    <rect x="0" y="22" width="100" height="32" rx="4" fill="#e2136e" opacity="0.85"/>
    <text x="50" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">bKash</text>
    <rect x="110" y="22" width="100" height="32" rx="4" fill="#f6921e" opacity="0.85"/>
    <text x="160" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">Nagad</text>
    <rect x="220" y="22" width="100" height="32" rx="4" fill="#1f3f57" stroke="#4d8dff" stroke-opacity="0.4"/>
    <text x="270" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4d8dff">Card</text>
  </g>
  <!-- Form -->
  <g transform="translate(20,166)">
    <text x="0" y="10" font-family="sans-serif" font-size="9" fill="#94a3b8">Mobile number</text>
    <rect x="0" y="14" width="360" height="32" rx="4" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.4"/>
    <text x="12" y="34" font-family="monospace" font-size="11" fill="#4d8dff">+880 1XXX-XXXXXX</text>
    <text x="0" y="64" font-family="sans-serif" font-size="9" fill="#94a3b8">Delivery address</text>
    <rect x="0" y="68" width="360" height="32" rx="4" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.4"/>
    <text x="12" y="88" font-family="monospace" font-size="11" fill="#cbd5e1">House 24, Banani, Dhaka</text>
  </g>
  <!-- Place order button -->
  <rect x="20" y="270" width="360" height="38" rx="6" fill="#4d8dff"/>
  <text x="200" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b0e11">Place Order — ৳4,300</text>
</svg>
