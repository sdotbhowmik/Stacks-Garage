    <text x="10" y="32" font-family="sans-serif" font-size="9" fill="#cbd5e1">Nazmul Hossain</text>
    <text x="0" y="56" font-family="sans-serif" font-size="8" fill="#94a3b8">Email</text>
    <rect y="60" width="200" height="26" rx="4" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.3"/>
    <text x="10" y="78" font-family="sans-serif" font-size="9" fill="#cbd5e1">nazmul@example.bd</text>
    <text x="0" y="102" font-family="sans-serif" font-size="8" fill="#94a3b8">Message</text>
    <rect y="106" width="200" height="56" rx="4" fill="#0b0e11" stroke="#4d8dff" stroke-opacity="0.3"/>
    <rect x="10" y="116" width="160" height="3" rx="1" fill="#cbd5e1" opacity="0.5"/>
    <rect x="10" y="124" width="180" height="3" rx="1" fill="#cbd5e1" opacity="0.5"/>
