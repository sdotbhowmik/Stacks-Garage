    <text x="14" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Office</text>
    <text x="14" y="46" font-family="sans-serif" font-size="8" fill="#cbd5e1">📞 +880 1XXX-XXXXXX</text>
    <text x="14" y="60" font-family="sans-serif" font-size="8" fill="#cbd5e1">✉ info@khulnaagro.bd</text>
    <text x="14" y="74" font-family="sans-serif" font-size="8" fill="#cbd5e1">📍 Khulna, Bangladesh</text>
