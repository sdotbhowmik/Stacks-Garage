<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg-cw3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3f57"/>
      <stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#bg-cw3)"/>
  <!-- Browser frame -->
  <rect x="10" y="10" width="380" height="40" rx="6" fill="#1f3f57" stroke="#ff7a29" stroke-opacity="0.3"/>
  <circle cx="28" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="30" r="5" fill="#27c93f"/>
  <rect x="90" y="22" width="240" height="16" rx="3" fill="#0b0e11" stroke="#ff7a29" stroke-opacity="0.2"/>
  <text x="105" y="33" font-family="monospace" font-size="9" fill="#ff7a29" opacity="0.7">admin.finsolve-bd.com</text>
  <!-- Sidebar -->
  <rect x="10" y="50" width="80" height="240" fill="#0b0e11"/>
  <g transform="translate(20,62)">
    <circle cx="10" cy="10" r="8" fill="#ff7a29"/>
    <text x="26" y="14" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">FinSolve</text>
  </g>
  <g transform="translate(20,92)" font-family="sans-serif" font-size="9" fill="#cbd5e1">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#ff7a29" fill-opacity="0.15"/>
    <text x="10" y="14" fill="#ff7a29">Dashboard</text>
    <text x="0" y="42">Accounts</text>
    <text x="0" y="62">Loans</text>
    <text x="0" y="82">Reports</text>
    <text x="0" y="102">Settings</text>
  </g>
  <!-- Topbar -->
  <rect x="90" y="50" width="300" height="36" fill="#1f3f57"/>
  <text x="105" y="72" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Dashboard</text>
  <circle cx="370" cy="68" r="11" fill="#ff7a29"/>
  <text x="370" y="72" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0b0e11">NH</text>
  <!-- KPI cards -->
  <g transform="translate(102,98)">
    <rect width="86" height="56" rx="4" fill="#0b0e11" stroke="#ff7a29" stroke-opacity="0.3"/>
    <text x="10" y="22" font-family="sans-serif" font-size="8" fill="#94a3b8">Total AUM</text>
    <text x="10" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff7a29">৳2.4B</text>
  </g>
  <g transform="translate(196,98)">
    <rect width="86" height="56" rx="4" fill="#0b0e11" stroke="#ff7a29" stroke-opacity="0.3"/>
    <text x="10" y="22" font-family="sans-serif" font-size="8" fill="#94a3b8">Active Loans</text>
    <text x="10" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff7a29">1,284</text>
  </g>
  <g transform="translate(290,98)">
    <rect width="86" height="56" rx="4" fill="#0b0e11" stroke="#ff7a29" stroke-opacity="0.3"/>
    <text x="10" y="22" font-family="sans-serif" font-size="8" fill="#94a3b8">NPL Ratio</text>
    <text x="10" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#22c55e">2.1%</text>
  </g>
  <!-- Chart -->
  <g transform="translate(102,166)">
    <rect width="272" height="118" rx="4" fill="#0b0e11" stroke="#ff7a29" stroke-opacity="0.3"/>
    <text x="10" y="18" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Disbursements — last 6 months</text>
    <polyline points="20,90 60,72 100,80 140,50 180,55 220,38 260,32" fill="none" stroke="#ff7a29" stroke-width="2" stroke-linecap="round"/>
    <polyline points="20,100 60,96 100,92 140,80 180,76 220,68 260,58" fill="none" stroke="#4c86b0" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
    <!-- Dots on chart -->
    <g fill="#ff7a29">
      <circle cx="20" cy="90" r="2.5"/>
      <circle cx="60" cy="72" r="2.5"/>
      <circle cx="100" cy="80" r="2.5"/>
      <circle cx="140" cy="50" r="2.5"/>
      <circle cx="180" cy="55" r="2.5"/>
      <circle cx="220" cy="38" r="2.5"/>
      <circle cx="260" cy="32" r="2.5"/>
    </g>
    <text x="20" y="112" font-family="sans-serif" font-size="7" fill="#94a3b8">Jan</text>
    <text x="100" y="112" font-family="sans-serif" font-size="7" fill="#94a3b8">Mar</text>
    <text x="180" y="112" font-family="sans-serif" font-size="7" fill="#94a3b8">May</text>
    <text x="260" y="112" font-family="sans-serif" font-size="7" fill="#94a3b8">Jul</text>
  </g>
</svg>
