<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg-cw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3f57"/>
      <stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#bg-cw)"/>
  <!-- Browser frame -->
  <rect x="10" y="10" width="380" height="40" rx="6" fill="#1f3f57" stroke="#ff7a29" stroke-opacity="0.3"/>
  <circle cx="28" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="30" r="5" fill="#27c93f"/>
  <rect x="90" y="22" width="240" height="16" rx="3" fill="#0b0e11" stroke="#ff7a29" stroke-opacity="0.2"/>
  <text x="105" y="33" font-family="monospace" font-size="9" fill="#ff7a29" opacity="0.7">finsolve-bd.com</text>
  <!-- Premium corporate header -->
  <rect x="10" y="50" width="380" height="36" fill="#0b0e11" stroke="#ff7a29" stroke-opacity="0.15"/>
  <!-- Logo mark -->
  <g transform="translate(22,58)">
    <circle cx="10" cy="10" r="9" fill="#ff7a29"/>
    <circle cx="10" cy="10" r="4" fill="#0b0e11"/>
  </g>
  <text x="46" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">FinSolve BD</text>
  <text x="300" y="74" font-family="sans-serif" font-size="9" fill="#cbd5e1">Solutions</text>
  <text x="345" y="74" font-family="sans-serif" font-size="9" fill="#cbd5e1">Insights</text>
  <text x="385" y="74" font-family="sans-serif" font-size="9" fill="#cbd5e1">Login</text>
  <!-- Hero -->
  <rect x="10" y="86" width="380" height="130" fill="#ff7a29" fill-opacity="0.1"/>
  <text x="30" y="118" font-family="serif" font-size="20" font-weight="bold" fill="#ffffff">Bespoke financial</text>
  <text x="30" y="142" font-family="serif" font-size="20" font-weight="bold" fill="#ff7a29">technology</text>
  <text x="30" y="160" font-family="serif" font-size="20" font-weight="bold" fill="#ffffff">for modern Bangladesh</text>
  <text x="30" y="180" font-family="sans-serif" font-size="9" fill="#cbd5e1">Custom ERP • Treasury • Risk • Compliance</text>
  <rect x="30" y="192" width="100" height="14" rx="7" fill="#ff7a29"/>
  <text x="80" y="202" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0b0e11">Talk to us →</text>
  <!-- Trust strip -->
  <text x="200" y="240" text-anchor="middle" font-family="sans-serif" font-size="8" letter-spacing="1.5" fill="#94a3b8">TRUSTED BY BANGLADESH LEADERS</text>
  <g transform="translate(50,250)">
    <rect width="60" height="18" rx="3" fill="#1f3f57" stroke="#ff7a29" stroke-opacity="0.3"/>
    <text x="30" y="13" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94a3b8">Partner 1</text>
    <rect x="70" width="60" height="18" rx="3" fill="#1f3f57" stroke="#ff7a29" stroke-opacity="0.3"/>
    <text x="100" y="13" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94a3b8">Partner 2</text>
    <rect x="140" width="60" height="18" rx="3" fill="#1f3f57" stroke="#ff7a29" stroke-opacity="0.3"/>
    <text x="170" y="13" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94a3b8">Partner 3</text>
    <rect x="210" width="60" height="18" rx="3" fill="#1f3f57" stroke="#ff7a29" stroke-opacity="0.3"/>
    <text x="240" y="13" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94a3b8">Partner 4</text>
