<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="logo-network-mark" role="img" aria-label="StackGarage network mark">
  <style>
    /* Standalone mark — favicon + hero watermark. 200x200 pure vector.
       Refreshed aesthetic with added inner-hexagon accent. */
    .lg-node {
      transform-box: fill-box;
      transform-origin: center;
      animation: lg-pulse 4.4s ease-in-out infinite;
      transition: r 0.3s ease, filter 0.3s ease;
    }
    .lg-edge {
      stroke-dasharray: 90;
      stroke-dashoffset: 90;
      animation: lg-draw 1.6s ease-out forwards;
      opacity: 0.75;
    }
    .lg-edge:nth-of-type(1)  { animation-delay: 0.05s; }
    .lg-edge:nth-of-type(2)  { animation-delay: 0.20s; }
    .lg-edge:nth-of-type(3)  { animation-delay: 0.35s; }
    .lg-edge:nth-of-type(4)  { animation-delay: 0.50s; }
    .lg-edge:nth-of-type(5)  { animation-delay: 0.65s; }
    .lg-edge:nth-of-type(6)  { animation-delay: 0.80s; }
    .lg-edge:nth-of-type(7)  { animation-delay: 0.95s; }
    .lg-edge:nth-of-type(8)  { animation-delay: 1.10s; }
    .lg-edge:nth-of-type(9)  { animation-delay: 1.25s; }
    .lg-edge:nth-of-type(10) { animation-delay: 1.40s; }

    .lg-node:nth-of-type(1) { animation-delay: 0s;   }
    .lg-node:nth-of-type(2) { animation-delay: 0.2s; }
    .lg-node:nth-of-type(3) { animation-delay: 0.4s; }
    .lg-node:nth-of-type(4) { animation-delay: 0.6s; }
    .lg-node:nth-of-type(5) { animation-delay: 0.8s; }
    .lg-node:nth-of-type(6) { animation-delay: 1.0s; }
    .lg-node:nth-of-type(7) { animation-delay: 1.2s; }

    .logo-network-mark:hover .lg-node {
      animation-duration: 2.2s;
      filter: drop-shadow(0 0 6px #00f2fe);
    }
    .logo-network-mark:hover .lg-node:nth-of-type(odd) { r: 8; }

    @keyframes lg-pulse {
      0%, 100% { opacity: 0.6;  transform: scale(0.85); }
      50%      { opacity: 1;    transform: scale(1.15); }
    }
    @keyframes lg-draw {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lg-node, .lg-edge { animation: none; }
      .lg-edge { stroke-dashoffset: 0; opacity: 0.7; }
    }
  </style>

  <!-- Outer hexagonal ring (decorative) -->
  <polygon points="100,18 168,55 168,145 100,182 32,145 32,55"
           fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.22"/>
  <!-- Inner hexagonal ring (adds depth) -->
  <polygon points="100,48 144,72 144,128 100,152 56,128 56,72"
           fill="none" stroke="#00f2fe" stroke-width="0.7" opacity="0.4"/>

  <g class="logo-network" aria-hidden="true">
    <!-- Pentagon perimeter -->
    <line class="lg-edge" x1="100" y1="50"  x2="158" y2="86"  stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round"/>
    <line class="lg-edge" x1="158" y1="86"  x2="140" y2="148" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round"/>
    <line class="lg-edge" x1="140" y1="148" x2="60"  y2="148" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round"/>
    <line class="lg-edge" x1="60"  y1="148" x2="42"  y2="86"  stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round"/>
    <line class="lg-edge" x1="42"  y1="86"  x2="100" y2="50"  stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Center spokes to outer ring -->
    <line class="lg-edge" x1="100" y1="100" x2="100" y2="50"  stroke="#00f2fe" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
    <line class="lg-edge" x1="100" y1="100" x2="158" y2="86"  stroke="#00f2fe" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
    <line class="lg-edge" x1="100" y1="100" x2="140" y2="148" stroke="#00f2fe" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
    <line class="lg-edge" x1="100" y1="100" x2="60"  y2="148" stroke="#00f2fe" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
    <line class="lg-edge" x1="100" y1="100" x2="42"  y2="86"  stroke="#00f2fe" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>

    <!-- Outer pentagon nodes -->
    <circle class="lg-node" cx="100" cy="50"  r="7" fill="#ffffff" stroke="#00f2fe" stroke-width="2"/>
    <circle class="lg-node" cx="158" cy="86"  r="7" fill="#ffffff" stroke="#00f2fe" stroke-width="2"/>
    <circle class="lg-node" cx="140" cy="148" r="7" fill="#ffffff" stroke="#00f2fe" stroke-width="2"/>
    <circle class="lg-node" cx="60"  cy="148" r="7" fill="#ffffff" stroke="#00f2fe" stroke-width="2"/>
    <circle class="lg-node" cx="42"  cy="86"  r="7" fill="#ffffff" stroke="#00f2fe" stroke-width="2"/>

    <!-- Inner hexagon accent nodes (smaller, on the inner ring corners) -->
    <circle class="lg-node" cx="100" cy="72"  r="4" fill="#00f2fe" opacity="0.85"/>
    <circle class="lg-node" cx="129" cy="100" r="4" fill="#00f2fe" opacity="0.85"/>

    <!-- Center node (pulsing heart of the mark) -->
    <circle class="lg-node" cx="100" cy="100" r="11" fill="#00f2fe"/>
  </g>
</svg>
